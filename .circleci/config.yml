version: 2.1

jobs:
  build:
    machine: true  # Use default machine executor (Ubuntu 20.04)
    steps:
      - checkout
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Build Project
          command: npm run dev &  # Replace this with your actual build command

workflows:
  version: 2
  build_project:
    jobs:
      - build
 
