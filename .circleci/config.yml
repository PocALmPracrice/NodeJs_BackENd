version: 2.1

executors:
  node-executor:
    docker:
      - image: circleci/node:20.12  # Node.js version
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Build Project
          command: npm run dev &  # Replace this with your actual build command

workflows:
  version: 2
  build_project:
    jobs:
      - build
